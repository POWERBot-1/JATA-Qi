[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jataqi-sdk"
version = "0.1.0"
description = "JATA Qi — Python SDK for the modular AI operating system (zero-dependency HTTP + WebSocket client)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["jata-qi", "ai", "sdk", "api", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["jataqi_sdk"]
