# JATA Qi — Prometheus alerting rules (PrometheusRule CRD for the operator).
# Alerts are derived from the gateway's RED metrics (jataqi_requests_total,
# jataqi_request_duration_ms, jataqi_requests_in_flight).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jataqi-alerts
  namespace: jataqi
  labels:
    app.kubernetes.io/name: jataqi
    release: prometheus
spec:
  groups:
    - name: jataqi.rules
      rules:
        - alert: JataQiHighErrorRate
          expr: |
            sum(rate(jataqi_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(jataqi_requests_total[5m])), 1) > 0.05
          for: 5m
          labels: { severity: critical, service: jataqi }
          annotations:
            summary: "JATA Qi error rate above 5%"
            description: "More than 5% of requests are returning 5xx over the last 5m."

        - alert: JataQiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, path) (rate(jataqi_request_duration_ms_bucket[5m]))) > 1000
          for: 10m
          labels: { severity: warning, service: jataqi }
          annotations:
            summary: "JATA Qi p95 latency above 1s"
            description: "p95 request latency exceeds 1 second for some route."

        - alert: JataQiDown
          expr: up{job="jataqi"} == 0
          for: 2m
          labels: { severity: critical, service: jataqi }
          annotations:
            summary: "JATA Qi gateway is down"
            description: "Prometheus cannot scrape the JATA Qi gateway."

        - alert: JataQiPodNotReady
          expr: kube_deployment_status_replicas_available{deployment="jataqi"} < 1
          for: 5m
          labels: { severity: critical, service: jataqi }
          annotations:
            summary: "JATA Qi has no ready replicas"
            description: "No JATA Qi pods are passing the readiness check."

        - alert: JataQiSessionStoreUnreachable
          expr: jataqi_requests_total{path="/readyz",status="503"} > 0
          for: 2m
          labels: { severity: critical, service: jataqi }
          annotations:
            summary: "JATA Qi readiness probe failing"
            description: "The gateway reports not-ready (storage/security checks failing)."

        # --- Tool governance SLA alerts (tool-intelligence metrics) ---

        - alert: JataQiToolApprovalQueueHigh
          expr: jataqi_tool_pending_approvals > 5
          for: 10m
          labels: { severity: warning, service: jataqi }
          annotations:
            summary: "Tool approval queue backing up"
            description: "More than 5 tool approval requests have been pending for over 10 minutes — human review is lagging."

        - alert: JataQiToolGovernanceDenySpike
          expr: increase(jataqi_tool_governance_decisions_total{decision="DENY"}[5m]) > 5
          for: 5m
          labels: { severity: critical, service: jataqi }
          annotations:
            summary: "Governance DENY spike"
            description: "More than 5 governance DENY decisions in 5 minutes — possible policy misconfiguration or abuse."

        - alert: JataQiToolR4InvocationRateHigh
          expr: sum(rate(jataqi_tool_invocations_total{risk=~"R4|R5"}[5m])) * 300 > 20
          for: 5m
          labels: { severity: warning, service: jataqi }
          annotations:
            summary: "High-risk tool invocation rate elevated"
            description: "More than 20 R4/R5 (financial/infrastructure) invocations in 5 minutes — verify the approval gates are holding."
