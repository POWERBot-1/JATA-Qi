{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "jataqi.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.certManager .Values.security.tls.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.security.tls.certManager.clusterIssuer | quote }}
    {{- end }}    nginx.ingress.kubernetes.io/enable-cors: {{ .Values.jataqi.cors.enabled | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
