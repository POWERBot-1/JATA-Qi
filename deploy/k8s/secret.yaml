# JATA Qi — secrets template. NEVER commit real values.
# Create real secrets with, e.g.:
#   kubectl create secret generic jataqi-secrets -n jataqi \
#     --from-literal=JATAQI_ADMIN_USERNAME=admin \
#     --from-literal=JATAQI_ADMIN_PASSWORD='$(openssl rand -base64 24)' \
#     --from-literal=OPENAI_API_KEY=sk-...
# Or seal this manifest with kubeseal / SOPS for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: jataqi-secrets
  namespace: jataqi
  labels:
    app.kubernetes.io/name: jataqi
type: Opaque
stringData:
  JATAQI_ADMIN_USERNAME: "CHANGE_ME"
  JATAQI_ADMIN_PASSWORD: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
