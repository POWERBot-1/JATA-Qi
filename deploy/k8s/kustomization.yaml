# JATA Qi — Kustomize base. Apply with: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app.kubernetes.io/name: jataqi
  app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - networkpolicy-backup.yaml
  - networkpolicy-observability.yaml
images:
  - name: ghcr.io/powerbot-1/jataqi
    newTag: 0.1.0
