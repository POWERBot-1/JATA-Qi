# JATA Qi — ServiceAccount + minimal RBAC (read-only self, for health/discovery).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jataqi
  namespace: jataqi
  labels:
    app.kubernetes.io/name: jataqi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jataqi
  namespace: jataqi
  labels:
    app.kubernetes.io/name: jataqi
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jataqi
  namespace: jataqi
  labels:
    app.kubernetes.io/name: jataqi
subjects:
  - kind: ServiceAccount
    name: jataqi
    namespace: jataqi
roleRef:
  kind: Role
  name: jataqi
  apiGroup: rbac.authorization.k8s.io
