# JATA Qi — Kubernetes namespace
# Apply with: kubectl apply -k deploy/k8s  (or kubectl apply -f deploy/k8s/)
apiVersion: v1
kind: Namespace
metadata:
  name: jataqi
  labels:
    app.kubernetes.io/name: jataqi
    app.kubernetes.io/part-of: jataqi
    # Pod Security Standards — enforce the RESTRICTED profile (PSS v1.24+).
    # The workload already complies: runAsNonRoot, drop ALL caps, seccomp
    # RuntimeDefault, readOnlyRootFilesystem, allowPrivilegeEscalation=false.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.29
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
