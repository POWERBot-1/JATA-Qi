# R-01 continuous integration — the repository's first automated merge gate.
#
# Before R-01 there was no CI at all: every milestone through P-01 was merged
# with no automated verification. This workflow runs the real build, the real
# lint gate, and the real aggregated test suite.
#
# HONESTY REQUIREMENT: the PostgreSQL integration suites boot a real embedded
# PostgreSQL. Where those binaries cannot start, the suites report SKIP by
# design and MUST NOT be reported as a pass. The `pg-integration-status` step
# below surfaces that distinction explicitly in the job log rather than hiding
# it behind an aggregate green check.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify workspace/lockfile integrity
        run: npm run check:workspaces

      - name: Build all workspaces
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (all workspaces)
        run: npm test

      - name: PostgreSQL integration status
        if: always()
        run: |
          echo "PostgreSQL integration suites are gated on a real embedded PostgreSQL."
          echo "If the runner could not start it, those suites report SKIP and this run"
          echo "must NOT be read as PostgreSQL-verified. Inspect the storage-postgres and"
          echo "loop-host suite output above for 'SKIPPED: PostgreSQL integration'."
          npx --yes --no-install true || true
          if npm test --silent 2>&1 | grep -qi 'SKIPPED: PostgreSQL integration'; then
            echo "RESULT: DATABASE INTEGRATION NOT EXECUTED (suites skipped)."
          else
            echo "RESULT: PostgreSQL integration suites did not report SKIP in this environment."
          fi
